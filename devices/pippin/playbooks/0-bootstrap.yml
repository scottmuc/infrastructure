- name: Bootstrap raspberry pi device to enable ansible automation runs.
  hosts: pippin.middle-earth.internal.
  gather_facts: false
  become: true

  # Raspian image sets up the bootstrap user to be able to sudo, and we
  # need to override inventory configuration since we don't have doas yet.
  # Setting as vars to override the vars in the inventory.yml
  # Ref: https://docs.ansible.com/projects/ansible/latest/reference_appendices/general_precedence.html
  vars:
    ansible_user: bootstrap
    ansible_become_method: ansible.builtin.sudo

  pre_tasks:
    - name: Attempt to update apt's cache
      ansible.builtin.apt:
        update_cache: true

  tasks:
    - name: Create admin user group
      ansible.builtin.group:
        name: admin
        system: true
        state: present

    - name: Create ansible user
      ansible.builtin.user:
        name: ansible
        shell: /bin/bash
        comment: "Ansible management user"
        home: /home/ansible
        createhome: true
        groups: admin
        append: true

    - name: Ensure doas is installed
      ansible.builtin.apt:
        name: doas
        state: present

    - name: Permit ansible to elevate privileges without root password
      ansible.builtin.copy:
        dest: /etc/doas.conf
        owner: root
        group: admin
        mode: '0640'
        content: |
          # Intentionally configuring ansible to not require a password to elevate privs
          permit nopass ansible

    - name: Initialized authorized_keys for the ansible user
      ansible.posix.authorized_key:
        user: ansible
        state: present
        key: "{{ lookup('file', playbook_dir + '/../../authorized_keys') }}"

