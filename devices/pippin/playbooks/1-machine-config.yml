- name: Setup device specific configuration
  hosts: pippin.middle-earth.internal.

  tasks:
    # cloud-init will set this, but it's good to keep this here to ensure it remains
    # a documented persistent configuration change.
    - name: Set hostname
      become: true
      ansible.builtin.hostname:
        name: pippin


    - name: Configure sysctls
      become: true
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
      tags: [sysctls]
      loop:
        # https://linuxhint.com/understanding_vm_swappiness/
        - name: vm.swappiness
          value: '1'
        # Disable IPv6
        - name: net.ipv6.conf.all.disable_ipv6
          value: '1'
        - name: net.ipv6.conf.default.disable_ipv6
          value: '1'
        - name: net.ipv6.conf.lo.disable_ipv6
          value: '1'


