# It's important that this happens before installing dnsmasq, otherwise it'll
# start running with the default configuration which has port collisions with
# unbound.
- name: Configure dnsmasq
  become: true
  ansible.builtin.copy:
    src: root/etc/dnsmasq.conf
    dest: /etc/dnsmasq.conf
    owner: root
    group: admin
    mode: '0664'
  notify:
    - Restart dnsmasq


- name: Install dnsmasq
  become: true
  ansible.builtin.apt:
    pkg:
      - dnsmasq


- name: Ensure dnsmasq service is started
  become: true
  ansible.builtin.service:
    name: dnsmasq
    state: started
    enabled: true


# avahi-daemon listens on :5353 which I use for dnsmasq. The Raspbery PI Imager
# application creates a cloud-init user-data file that installs avahi-daemon for
# reasons I don't understand.
#
# The removal of the isc-dhcp-client is easier to explain. Why have a dhcp client
# on a server intended to be a dhcp server?
- name: Ensure avahi-daemon and isc-dhcp-client are not installed
  become: true
  ansible.builtin.apt:
    pkg:
      - avahi-daemon
      - isc-dhcp-client
    state: absent


- name: Static IP via NetworkManager
  become: true
  community.general.nmcli:
    conn_name: netplan-eth0
    ifname: eth0
    type: ethernet
    ip4: 192.168.2.10/24
    gw4: 192.168.2.1
    dns4:
      - 127.0.0.1
      - 192.168.2.11
    dns4_search:
      - middle-earth.internal
    method4: manual
    autoconnect: true
    state: present


# TODO: this shouldn't be managed here, move to top-level unbound-resolvers
- name: Install /etc/resolv.conf
  become: true
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      search middle-earth.internal
      nameserver 127.0.0.1
      nameserver 9.9.9.9
  notify:
    - Restart dnsmasq


- name: Install /etc/hosts
  become: true
  ansible.builtin.copy:
    dest: /etc/hosts
    owner: root
    group: root
    mode: '0644'
    content: |
      127.0.0.1     localhost
      192.168.2.10  pippin.middle-earth.internal  pippin
      192.168.2.11  merry.middle-earth.internal   merry
      192.168.2.19  erebor.middle-earth.internal  erebor
      192.168.2.20  gandalf.middle-earth.internal gandalf
  notify:
    - Restart dnsmasq

